<style>
/* The page is one card, face up on her table. Her name is the card's title; the year she began is its number. */
:root{
  --table:#7A1238; --table-2:#93183F; --card:#FBF4E6; --ink:#2B0F1B; --soft:#6E4A57;
  --gold:#C9973A; --wa:#128C4A; --wa-ink:#fff;
  --display:"Suez One","Frank Ruhl Libre",Georgia,serif; --body:"Assistant","Arial Hebrew",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;
  background:var(--table);
  background-image:radial-gradient(120% 80% at 50% 0%,var(--table-2) 0,transparent 60%),
    repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.025) 0 2px,transparent 2px 7px);
  color:var(--ink);font:18px/1.55 var(--body);
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{width:min(440px,100%);aspect-ratio:auto;background:var(--card);border-radius:22px;padding:12px;
  box-shadow:0 2px 0 #E8D9BC,0 30px 60px rgba(40,0,15,.45);transform:rotate(-1.2deg);
  animation:lay .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes lay{from{transform:translateY(24px) rotate(-6deg);opacity:0}to{transform:rotate(-1.2deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.frame{border:2px solid var(--gold);border-radius:14px;padding:22px 22px 18px;display:grid;gap:18px;position:relative;text-align:center}
.frame::before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);border-radius:10px;opacity:.55;pointer-events:none}
.num{font:400 22px/1 var(--display);color:var(--gold);letter-spacing:.12em}
.sigil{width:120px;height:120px;margin:0 auto;display:block}
h1{font:400 clamp(38px,11vw,52px)/1 var(--display);margin:0;text-wrap:balance}
.role{margin:-8px 0 0;color:var(--soft);font-size:17px}
.line{margin:0;font-size:20px;line-height:1.5;text-wrap:balance}
.line b{font-weight:800}
.offers{display:grid;gap:8px;text-align:right}
.offer{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:8px;padding:12px 14px;border-radius:12px;background:#F3E7D0}
.offer b{font-size:18px} .offer span{display:block;font-size:15px;color:var(--soft)}
.offer em{font:800 22px var(--body);font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:var(--wa);color:var(--wa-ink);
  font:800 21px var(--body);padding:16px 18px;border-radius:14px;box-shadow:0 4px 0 #0B6434;transition:transform .12s,box-shadow .12s}
.wa:active{transform:translateY(3px);box-shadow:0 1px 0 #0B6434}
.wa:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wa svg{width:26px;height:26px;flex:none}
.tel{margin:-6px 0 0;font-size:16px;color:var(--soft)}
.tel a{color:inherit;font-weight:600;direction:ltr;unicode-bidi:embed}
.foot{border-top:1px solid var(--gold);padding-top:12px;font:400 19px var(--display);letter-spacing:.02em}
.foot small{display:block;font:400 14px var(--body);color:var(--soft);letter-spacing:0}
</style>
</head>
<body>
<main class="card" aria-label="אילנית בן שושן">
  <div class="frame">
    <div class="num">מאז 1985</div>
    <svg class="sigil" viewBox="0 0 120 120" aria-hidden="true">

      <circle cx="60" cy="60" r="44" fill="none" stroke="#C9973A" stroke-width="1" stroke-dasharray="2 5"/>
      <path d="M60 18 L68 52 L102 60 L68 68 L60 102 L52 68 L18 60 L52 52 Z" fill="#7A1238"/>
      <circle cx="60" cy="60" r="7" fill="#FBF4E6" stroke="#C9973A" stroke-width="1.5"/>
    </svg>
    <h1>אילנית בן שושן</h1>
    <p class="role">טארוט ותקשור · המרכז הרוחני, רחובות</p>
    <p class="line">פגישה איתי לא מתחילה במה שתספרי לי.<br><b>היא מתחילה במה שעולה בקלפים.</b></p>
    <div class="offers">
      <div class="offer"><div><b>פגישה בקליניקה ברחובות</b><span>שעה</span></div><em>750 ₪</em></div>
      <div class="offer"><div><b>ייעוץ בטלפון או בזום</b><span>כחצי שעה</span></div><em>450 ₪</em></div>
    </div>
    <a class="wa" href="https://wa.me/972522272020?text=%D7%94%D7%99%D7%99%20%D7%90%D7%99%D7%9C%D7%A0%D7%99%D7%AA%2C%20%D7%94%D7%92%D7%A2%D7%AA%D7%99%20%D7%9E%D7%94%D7%90%D7%AA%D7%A8%20%D7%95%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%A7%D7%91%D7%95%D7%A2">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2s.2-1.1.1-1.2-.2-.2-.4-.3Z"/></svg>
      לקבוע בוואטסאפ
    </a>
    <p class="tel">או בטלפון: <a href="tel:+972522272020">052-2272020</a></p>
    <div class="foot">המרכז הרוחני של אילנית<small>רחובות · בתיאום מראש</small></div>
  </div>
</main>
</body>
